services:
  # Redis service for multi-worker shared state management
  redis:
    image: redis:7-alpine
    container_name: blackgate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  connector:
    build: .
    container_name: connector
    ports:
      - "10001:10001"
    env_file:
      - .env
    environment:
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - BLOCKCHAIN_WALLET_PRVT_KEY=${BLOCKCHAIN_WALLET_PRVT_KEY}
      - BLOCKCHAIN_WALLET_ADDR=${BLOCKCHAIN_WALLET_ADDR}
      - BLOCKCHAIN_CHAIN_ID=${BLOCKCHAIN_CHAIN_ID}
      - ZKSYNC_NODE_TYPE=${ZKSYNC_NODE_TYPE}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_AUTH_ANON_KEY=${SUPABASE_AUTH_ANON_KEY}
      - SUPABASE_AUTH_SERV_KEY=${SUPABASE_AUTH_SERV_KEY}
      - SUPABASE_AUTH_JWT_SECRET=${SUPABASE_AUTH_JWT_SECRET}
      - SUPABASE_JWT_ALGORITHM=${SUPABASE_JWT_ALGORITHM}
      - SUPABASE_JWT_EXPIRES=${SUPABASE_JWT_EXPIRES}
      - CRED_SERVER_URL=${CRED_SERVER_URL}
      - DEBUG=${DEBUG}
      - REDIS_URL=${REDIS_URL}
      - MULTI_WORKER_MODE=${MULTI_WORKER_MODE}
      - WORKER_COUNT=${WORKER_COUNT}
      - BLOCKCHAIN_WORKERS=${BLOCKCHAIN_WORKERS}
      - BLOCKCHAIN_BATCH_SIZE=${BLOCKCHAIN_BATCH_SIZE}
    volumes:
      - .:/connector
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
    driver: local
